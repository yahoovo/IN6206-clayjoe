spring.application.name=backend
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/clayjoe
spring.datasource.username=clayjoe_app
spring.datasource.password=${CLAYJOE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fixed course-demo FX rate; not a real-time exchange rate.
clayjoe.pricing.sgd-to-cny=${CLAYJOE_SGD_TO_CNY_RATE:5.30}
clayjoe.notification.base-url=http://127.0.0.1:8084
clayjoe.notification.api-key=${CLAYJOE_INTERNAL_API_KEY}
